<!doctype html>
<html lang="th">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>D3v</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #F3F5F8; --surface: #FFFFFF; --raised: #F8FAFC; --sunken: #EEF1F5;
    --line: #DDE3EA; --line-strong: #C9D1DB;
    --fg: #141922; --fg-2: #3B4552; --muted: #66717F; --faint: #97A1AE;
    --accent: #2F6FED; --accent-ink: #FFFFFF; --accent-soft: #E6EEFF;
    --good: #1F9D62; --good-soft: #E3F5EC;
    --warn: #C77A12; --warn-soft: #FBF0DC;
    --bad: #D64545; --bad-soft: #FBE5E5;
    --term-bg: #0B0E12; --term-fg: #C8D0DA; --term-line: #1A2029;
    --shadow: 0 1px 2px rgba(20,25,34,.06), 0 8px 24px -12px rgba(20,25,34,.18);
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", "Noto Sans Thai", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --r: 8px;
    --ease: cubic-bezier(.2, .7, .3, 1);
    --fast: .13s; --med: .22s;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E1116; --surface: #151A21; --raised: #1B2129; --sunken: #10141A;
      --line: #262E38; --line-strong: #344050;
      --fg: #E6EAF0; --fg-2: #C2CAD4; --muted: #8A94A2; --faint: #5E6875;
      --accent: #5B93FF; --accent-ink: #0B1220; --accent-soft: #1A2740;
      --good: #3CCB85; --good-soft: #14301F;
      --warn: #F0B44A; --warn-soft: #3A2A0E;
      --bad: #F0716D; --bad-soft: #3B1A1A;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1116; --surface: #151A21; --raised: #1B2129; --sunken: #10141A;
    --line: #262E38; --line-strong: #344050;
    --fg: #E6EAF0; --fg-2: #C2CAD4; --muted: #8A94A2; --faint: #5E6875;
    --accent: #5B93FF; --accent-ink: #0B1220; --accent-soft: #1A2740;
    --good: #3CCB85; --good-soft: #14301F;
    --warn: #F0B44A; --warn-soft: #3A2A0E;
    --bad: #F0716D; --bad-soft: #3B1A1A;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  code, .mono { font-family: var(--mono); font-size: .93em; }
  .num { font-variant-numeric: tabular-nums; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  [hidden] { display: none !important; }

  /* ---------------------------------------------------------------- top bar */
  .top {
    display: flex; align-items: center; gap: 16px; padding: 0 20px; height: 52px;
    background: var(--surface); border-bottom: 1px solid var(--line); flex: none;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: -.01em; }
  .brand .mark {
    height: 24px; padding: 0 7px; border-radius: 6px; background: var(--fg); color: var(--bg);
    display: grid; place-items: center; font: 600 12px var(--mono); letter-spacing: .02em;
  }
  .brand small { color: var(--muted); font-weight: 400; font-size: 12px; }
  .summary { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; }
  .summary .sep { color: var(--faint); }
  .summary b { color: var(--fg); font-weight: 500; }
  .top .grow { flex: 1; }
  .icon-btn {
    width: 32px; height: 32px; border-radius: var(--r); border: 1px solid var(--line);
    background: var(--surface); color: var(--muted); display: grid; place-items: center;
  }
  .icon-btn:hover { color: var(--fg); border-color: var(--line-strong); }
  .icon-btn svg { width: 16px; height: 16px; }

  .lang { display: inline-flex; height: 32px; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
  .lang button { border: 0; background: var(--surface); color: var(--muted); padding: 0 10px; font: 500 12px var(--mono); letter-spacing: .04em; }
  .lang button:hover { color: var(--fg); }
  .lang button.on { background: var(--fg); color: var(--bg); }

  /* ---------------------------------------------------------------- buttons */
  .btn {
    display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px;
    border-radius: var(--r); border: 1px solid var(--line); background: var(--surface);
    color: var(--fg); font-weight: 500; font-size: 13px; white-space: nowrap;
  }
  .btn:hover { border-color: var(--line-strong); background: var(--raised); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn.danger:hover { color: var(--bad); border-color: var(--bad); background: var(--bad-soft); }
  .btn.sm { height: 26px; padding: 0 9px; font-size: 12px; }
  .btn:disabled { opacity: .5; cursor: progress; }
  .btn svg { width: 14px; height: 14px; }
  .spin { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ------------------------------------------------------------------ shell */
  /* ---------------------------------------------------------------- nav */
  .menu { display: flex; align-items: stretch; gap: 2px; margin-left: 12px; height: 100%; }
  .menu a {
    display: inline-flex; align-items: center; gap: 7px; padding: 0 12px; color: var(--muted);
    text-decoration: none; font-weight: 500; font-size: 13.5px; border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .menu a:hover { color: var(--fg); }
  .menu a.on { color: var(--fg); border-bottom-color: var(--fg); }
  .menu a svg { width: 15px; height: 15px; opacity: .8; }
  .menu a span.k { font: 500 10.5px var(--mono); color: var(--faint); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }

  .view { flex: 1; min-height: 0; display: flex; flex-direction: column; }

  /* ------------------------------------------------------------ m-stacks */
  .m-stacks .shell { flex: 1; min-height: 0; display: grid; grid-template-columns: var(--side-w, 264px) 6px 1fr; }

  /* draggable edges */
  .gutter { position: relative; z-index: 1; touch-action: none; user-select: none; }
  .gutter.v { cursor: col-resize; margin: 0 -3px; width: 6px; }
  .gutter.h { cursor: row-resize; margin: -3px 0; height: 6px; }
  .gutter::after { content: ''; position: absolute; inset: 0; margin: auto; background: transparent; border-radius: 2px; transition: background .12s; }
  .gutter.v::after { width: 2px; }
  .gutter.h::after { height: 2px; }
  .gutter:hover::after, .gutter.dragging::after { background: var(--accent); }

  .side {
    background: var(--surface); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0;
  }
  .side-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px 8px; font-size: 11px; font-weight: 600; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted);
  }
  .side-head .count { font-weight: 500; letter-spacing: 0; text-transform: none; font-family: var(--mono); }
  .list { overflow: auto; padding: 0 8px 12px; display: flex; flex-direction: column; gap: 2px; }
  .item {
    display: grid; grid-template-columns: 10px 1fr auto; align-items: center; gap: 10px;
    width: 100%; text-align: left; padding: 9px 10px; border-radius: var(--r);
    border: 1px solid transparent; background: transparent; position: relative;
  }
  .item::before {
    content: ''; position: absolute; left: 0; top: 50%; width: 2px; height: 0;
    background: var(--accent); border-radius: 0 2px 2px 0; transform: translateY(-50%);
    transition: height var(--med) var(--ease);
  }
  .item.on::before { height: 62%; }
  .item:hover { background: var(--raised); }
  .item.on { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
  .item .nm { font-weight: 500; display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .item .nm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .nm small { color: var(--faint); font-size: 11px; font-weight: 400; }
  .item .bang {
    width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center;
    font: 600 12px var(--mono); color: var(--warn); background: var(--warn-soft);
    cursor: help;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); justify-self: center; }
  .dot.on { background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 22%, transparent); }
  .side-foot { margin-top: auto; padding: 10px 16px 14px; font-size: 12px; color: var(--faint); border-top: 1px solid var(--line); }
  .side-foot code { color: var(--muted); }

  /* The stack page never scrolls as a whole: the header is fixed and the board
     fills what is left, sizing its rows to fit. */
  .main { min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }

  /* --------------------------------------------------------------- detail */
  .detail { padding: 16px 28px 12px; display: flex; flex-direction: column; gap: 14px; flex: none; }
  .d-head { display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  .d-title { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
  .d-title h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.015em; display: flex; align-items: center; gap: 10px; text-wrap: balance; }
  .d-title .path { font-family: var(--mono); font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
  .state {
    display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px 0 7px;
    border-radius: 999px; font-size: 12px; font-weight: 500;
    background: var(--sunken); color: var(--muted); border: 1px solid var(--line);
  }
  .state .dot { width: 6px; height: 6px; }
  .state.on { background: var(--good-soft); color: var(--good); border-color: transparent; }
  .state.on .dot { background: var(--good); box-shadow: none; }
  .tag {
    font-size: 11px; padding: 1px 7px; border-radius: 4px; background: var(--sunken);
    color: var(--muted); border: 1px solid var(--line); text-transform: uppercase; letter-spacing: .05em;
    font-weight: 500;
  }
  .tag.auto { color: var(--accent); background: var(--accent-soft); border-color: transparent; margin-left: 6px; vertical-align: 1px; }
  .d-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .p-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 10px 14px; border-bottom: 1px solid var(--line);
    font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  }
  .p-head .btn { text-transform: none; letter-spacing: 0; }
  /* A row is three cells and the separator is drawn on each of them, so the
     three must end at the same height. align-items:center made every cell only
     as tall as its own content and centred it: the empty action cell is 18px
     against the 37.5px of the text beside it, so its border sat ~10px high and
     the line broke into a stub at the right edge. Default stretch keeps the
     three the same height, and a cell whose text wraps to two lines no longer
     leaves its neighbours' borders floating mid-row either. */
  .kv { display: grid; grid-template-columns: max-content 1fr auto; }
  .kv > div { padding: 9px 14px; border-bottom: 1px solid var(--line); min-width: 0; }
  .kv > div:nth-last-child(-n+3) { border-bottom: 0; }
  .kv .k { font-family: var(--mono); font-size: 13px; font-weight: 500; }
  .kv .v { font-family: var(--mono); font-size: 12.5px; color: var(--fg-2); overflow-wrap: anywhere; }
  .kv .v.muted { color: var(--faint); }
  .kv .v.held { color: var(--warn); }
  /* The button centres itself in whatever height the row already has rather
     than setting it; an action cell with nothing in it gives its width back to
     the text instead of leaving a dead strip for the line to cross. */
  .kv .a { display: flex; align-items: center; justify-content: flex-end; padding-top: 4px; padding-bottom: 4px; }
  .kv .a:empty { padding: 0; }
  .kv .empty { grid-column: 1 / -1; color: var(--faint); font-size: 13px; padding: 14px; }
  .link {
    display: inline-flex; align-items: center; gap: 4px; color: var(--accent); text-decoration: none;
    font-family: var(--mono); font-size: 12.5px;
  }
  .link:hover { text-decoration: underline; }
  .link svg { width: 12px; height: 12px; }
  .note { padding: 10px 14px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); }

  /* ---------------------------------------------------------------- board */
  .board { position: relative; flex: 1; min-height: 0; margin: 2px 18px 16px 28px; }
  .board.overflowing { overflow-y: auto; }
  .gp {
    position: absolute; margin-right: 10px; display: flex; flex-direction: column; overflow: hidden;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    transition: top .16s ease, left .16s ease, width .16s ease, height .16s ease,
                border-color var(--med) var(--ease), box-shadow var(--med) var(--ease);
  }
  .gp.moving { transition: none; z-index: 6; box-shadow: var(--shadow); cursor: grabbing; }
  .gp-head {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px 8px 14px; flex: none;
    transition: background-color var(--med) var(--ease), border-color var(--med) var(--ease);
    border-bottom: 1px solid var(--line); cursor: grab; user-select: none; touch-action: none;
    font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  }
  .gp-head:active { cursor: grabbing; }
  .gp-title { display: inline-flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gp-title .mono { text-transform: none; letter-spacing: 0; font-size: 12.5px; font-weight: 500; color: var(--fg); }
  .gp-tools { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; text-transform: none; letter-spacing: 0; font-weight: 500; }
  .gp-tools label { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); cursor: pointer; }
  .gp-x { all: unset; cursor: pointer; color: var(--faint); padding: 2px 5px; border-radius: 5px; font-size: 12px; line-height: 1; }
  .gp-x:hover { color: var(--bad); background: var(--bad-soft); }
  .gp.term .gp-x:hover { background: #2A1A1A; }

  /* ---------------------------------------------------------------- drawer */
  .drawer {
    position: absolute; top: 0; right: 0; bottom: 0; width: 290px; z-index: 8;
    background: var(--surface); border-left: 1px solid var(--line);
    display: flex; flex-direction: column; box-shadow: var(--shadow);
  }
  .drawer-head {
    display: flex; align-items: center; padding: 12px 10px 12px 16px; flex: none;
    border-bottom: 1px solid var(--line); font-size: 11px; font-weight: 600;
    letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  }
  .drawer-head .icon-btn { margin-left: auto; width: 26px; height: 26px; font-size: 12px; }
  .drawer-hint { padding: 12px 16px 6px; color: var(--muted); font-size: 12.5px; }
  .drawer-list { overflow: auto; padding: 6px 10px 14px; display: flex; flex-direction: column; gap: 6px; }
  .dr-item {
    display: flex; align-items: flex-start; gap: 10px; width: 100%; text-align: left;
    padding: 10px; border-radius: var(--r); border: 1px solid var(--line);
    background: var(--raised); color: var(--fg); cursor: grab; touch-action: none;
  }
  .dr-item:hover { border-color: var(--accent); }
  .dr-item:active { cursor: grabbing; }
  .dr-ico { color: var(--muted); display: grid; place-items: center; width: 18px; height: 18px; flex: none; margin-top: 1px; }
  .dr-ico svg { width: 16px; height: 16px; }
  .dr-txt { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .dr-txt b { font-weight: 500; font-size: 13.5px; }
  .dr-txt small { color: var(--muted); font-size: 12px; font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gp-body { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; }
  .gp-body .kv { align-content: start; }
  .gp-resize {
    position: absolute; right: 0; bottom: 0; width: 16px; height: 16px; cursor: nwse-resize; touch-action: none;
    background: linear-gradient(135deg, transparent 50%, var(--line-strong) 50%, var(--line-strong) 60%, transparent 60%, transparent 75%, var(--line-strong) 75%, var(--line-strong) 85%, transparent 85%);
    opacity: .7;
  }
  .gp:hover .gp-resize { opacity: 1; }
  .gp-ph { position: absolute; margin-right: 10px; border: 1px dashed var(--accent); border-radius: 10px; background: var(--accent-soft); opacity: .7; transition: all .12s; pointer-events: none; }

  .gp.term { background: var(--term-bg); border-color: var(--term-line); }
  .gp.term .gp-head { border-bottom-color: var(--term-line); color: #8A94A2; }
  .gp.term .gp-title .mono { color: #E6EAF0; }
  .gp.term .gp-tools label { color: #8A94A2; }
  .gp.term .gp-resize { background: linear-gradient(135deg, transparent 50%, #344050 50%, #344050 60%, transparent 60%, transparent 75%, #344050 75%, #344050 85%, transparent 85%); }
  pre.term {
    margin: 0; padding: 12px 16px 16px; flex: 1; min-height: 0; overflow: auto;
    color: var(--term-fg); font: 12.5px/1.5 var(--mono);
    white-space: pre-wrap; word-break: break-word; tab-size: 4;
  }
  pre.term { cursor: text; }
  pre.term:focus { outline: none; box-shadow: inset 0 0 0 1px var(--accent); }
  pre.term::-webkit-scrollbar { width: 10px; }
  pre.term::-webkit-scrollbar-thumb { background: #262E38; border-radius: 5px; }
  .term-empty { color: #5E6875; padding: 20px 16px; font-family: var(--mono); font-size: 12.5px; }
  .gp .live { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11.5px; color: #8A94A2; }
  .gp .live .dot { width: 6px; height: 6px; background: #3E4A58; }
  .gp .live.on .dot { background: #3CCB85; box-shadow: 0 0 0 3px rgba(60,203,133,.2); animation: breathe 3s ease-in-out infinite; }
  @keyframes breathe { 50% { box-shadow: 0 0 0 5px rgba(60,203,133,.32); } }
  .gp .tbtn { height: 22px; padding: 0 8px; border-radius: 6px; border: 1px solid #262E38; background: transparent; color: #8A94A2; font-size: 12px; }
  .gp .tbtn:hover { color: #E6EAF0; border-color: #344050; }
  .d-actions .icon-btn { height: 32px; }


  /* ---------------------------------------------------------------- empty */
  .welcome { margin: auto; max-width: 440px; text-align: center; padding: 40px 20px; }
  .welcome h2 { margin: 12px 0 6px; font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
  .welcome p { margin: 0 0 18px; color: var(--muted); }
  .welcome .mark { width: 44px; height: 44px; border-radius: 12px; margin: 0 auto; background: var(--fg); color: var(--bg); display: grid; place-items: center; font: 600 16px var(--mono); }

  /* --------------------------------------------------------------- dialog */
  dialog {
    border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--fg);
    padding: 0; width: min(94vw, 600px); max-height: 90vh; box-shadow: var(--shadow);
  }
  dialog::backdrop { background: rgba(8,10,14,.55); backdrop-filter: blur(2px); }
  .dlg-head { padding: 16px 20px 12px; font-weight: 600; font-size: 16px; border-bottom: 1px solid var(--line); }
  .dlg-body { padding: 18px 20px; overflow: auto; max-height: 64vh; display: flex; flex-direction: column; gap: 16px; }
  .dlg-foot { display: flex; align-items: center; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--line); }
  .dlg-foot .grow { flex: 1; }
  .field label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
  .field .hint { color: var(--muted); font-size: 12px; margin-top: 5px; }
  .field .hint code { color: var(--fg-2); }
  .in {
    width: 100%; height: 34px; padding: 0 10px; border-radius: var(--r);
    border: 1px solid var(--line); background: var(--bg); color: var(--fg);
  }
  .in:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  .in:disabled { color: var(--muted); background: var(--sunken); }
  .in.mono { font-family: var(--mono); font-size: 13px; }
  .row2 { display: flex; gap: 6px; }

  /* Status is always the same four colours — green, amber, red, grey. */
  .dot.starting { background: var(--warn); animation: pulse 1.2s ease-in-out infinite; }
  .dot.bad { background: var(--bad); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 25%, transparent); }
  @keyframes pulse { 50% { opacity: .3; } }
  .state.starting { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
  .state.starting .dot { background: var(--warn); box-shadow: none; animation: pulse 1.2s ease-in-out infinite; }
  .state.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
  .state.bad .dot { background: var(--bad); box-shadow: none; }
  .tag.exit { text-transform: none; letter-spacing: 0; }
  .tag.exit.bad { color: var(--bad); background: var(--bad-soft); border-color: transparent; }
  .gp.waiting { border-color: var(--warn); }
  .gp.waiting .gp-head { background: color-mix(in srgb, var(--warn) 14%, transparent); }
  .gp .tbtn.wait { color: var(--warn); border-color: var(--warn); animation: pulse 1.2s ease-in-out infinite; }
  .gp.zoomed { z-index: 5; }

  /* command palette */
  dialog.pal { width: min(92vw, 560px); margin-top: 12vh; }
  .pal input { width: 100%; height: 48px; border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 0 16px; font-size: 15px; color: var(--fg); outline: none; }
  .pal-list { max-height: 50vh; overflow: auto; padding: 6px; }
  .pal-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r); cursor: pointer; }
  .pal-item.on, .pal-item:hover { background: var(--accent-soft); }
  .pal-item .pal-ico { width: 16px; height: 16px; color: var(--muted); display: grid; place-items: center; flex: none; }
  .pal-item .pal-ico svg { width: 15px; height: 15px; }
  .pal-item .pal-label { flex: 1; font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pal-item code { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .pal-empty { padding: 18px; color: var(--faint); text-align: center; }
  .pal-foot { padding: 8px 14px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--faint); }
  .pal-btn { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); color: var(--muted); font-size: 12.5px; }
  .pal-btn:hover { color: var(--fg); border-color: var(--line-strong); }
  .pal-btn kbd { font: 500 10.5px var(--mono); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
  #notify.on { color: var(--accent); border-color: var(--accent); }

  /* How much of the account's allowance is gone. It is a ratio against a
     limit, so it is a meter whose fill carries the severity — and the number
     is written beside it, because a 34px bar is not a reading. */
  .usage { display: flex; align-items: center; gap: 14px; padding: 0 4px; }
  .u-w { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); cursor: help; }
  .u-w b { font-weight: 500; font-family: var(--mono); font-size: 10.5px; letter-spacing: .02em; }
  .u-w .meter { width: 38px; height: 4px; }
  .u-n { font-variant-numeric: tabular-nums; min-width: 26px; text-align: right; color: var(--fg-2); }
  details.adv summary { cursor: pointer; font-size: 13px; color: var(--muted); list-style: none; display: flex; align-items: center; gap: 6px; }
  details.adv summary::before { content: ''; width: 5px; height: 5px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(-45deg); transition: transform .12s; }
  details.adv[open] summary::before { transform: rotate(45deg); }
  details.adv summary:hover { color: var(--fg); }
  details.adv .field { margin-top: 14px; }
  .row2 .in { flex: 1; }
  .cmdrow { display: grid; grid-template-columns: 118px 1fr 28px; gap: 6px; align-items: center; margin-bottom: 6px; }
  .cmdrow button { all: unset; cursor: pointer; color: var(--faint); text-align: center; height: 28px; line-height: 28px; border-radius: 6px; }
  .cmdrow button:hover { color: var(--bad); background: var(--bad-soft); }
  .browser {
    margin-top: 8px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg);
    max-height: 200px; overflow: auto; font-family: var(--mono); font-size: 12.5px;
  }
  .browser div { padding: 6px 10px; cursor: pointer; border-bottom: 1px solid var(--line); display: flex; gap: 8px; }
  .browser div:last-child { border-bottom: 0; }
  .browser div:hover { background: var(--raised); color: var(--accent); }
  .browser .pick { color: var(--accent); font-weight: 500; }

  /* ----------------------------------------------------------------- toast */
  .toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 10; max-width: min(92vw, 460px); }
  .toast {
    background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--accent);
    border-radius: var(--r); padding: 10px 12px; box-shadow: var(--shadow); font-size: 13px;
    display: flex; flex-direction: column; gap: 3px; animation: rise .18s ease-out;
  }
  .toast.bad { border-left-color: var(--bad); }
  .toast.good { border-left-color: var(--good); }
  .toast code { color: var(--muted); font-size: 12px; }
  .toast pre { margin: 4px 0 0; font: 12px/1.45 var(--mono); color: var(--fg-2); white-space: pre-wrap; max-height: 140px; overflow: auto; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }

  /* ------------------------------------------------------------------ motion */
  /* Every animation here has a job: a transition confirms the click landed, an
     entry says where a thing came from, a one-shot flash marks a change worth
     catching. Only two things loop, and both mean "still going" — the starting
     dot and the live dot. */

  /* Anything clickable answers the pointer. */
  .btn, .icon-btn, .lang button, .pal-btn, .tbtn, .gp-x, .item, .menu a, .dr-item,
  .pal-item, .browser div, .cmdrow button, .bang, .link, .swatch {
    transition: background-color var(--fast) var(--ease), border-color var(--fast) var(--ease),
                color var(--fast) var(--ease), box-shadow var(--fast) var(--ease),
                opacity var(--fast) var(--ease), transform .09s var(--ease);
  }
  .btn:active:not(:disabled), .icon-btn:active, .pal-btn:active, .tbtn:active { transform: translateY(1px); }
  .dr-item:hover { transform: translateY(-1px); }

  /* Status marks ease between states instead of snapping, so a change reads as
     a change rather than a repaint. */
  .dot, .state, .st-pill, .tag, .chip { transition: background-color var(--med) var(--ease),
    color var(--med) var(--ease), border-color var(--med) var(--ease), box-shadow var(--med) var(--ease); }

  /* A state that just changed gets one ring, sized in its own colour. */
  @keyframes flash {
    from { box-shadow: 0 0 0 0 color-mix(in srgb, currentColor 45%, transparent); }
    to   { box-shadow: 0 0 0 9px transparent; }
  }
  .state.flash { animation: flash .85s var(--ease); }

  /* Dialogs arrive; their backdrop fades under them. */
  @keyframes dlg-in { from { opacity: 0; transform: translateY(-10px) scale(.985); } }
  @keyframes fade-in { from { opacity: 0; } }
  dialog[open] { animation: dlg-in var(--med) var(--ease); }
  dialog[open]::backdrop { animation: fade-in var(--med) var(--ease); }

  /* The drawer comes from the edge it is attached to. */
  @keyframes drawer-in { from { transform: translateX(100%); opacity: .3; } }
  .drawer:not([hidden]) { animation: drawer-in var(--med) var(--ease); }

  /* Board panels fade up when a stack is opened — never on a poll (the info
     panels are patched in place) and never when one panel is added or removed,
     because a new panel is already under the pointer being dragged. */
  @keyframes gp-in { from { opacity: 0; transform: translateY(10px); } }
  .board.enter .gp { animation: gp-in .28s var(--ease) both; }
  .board.enter .gp:nth-child(2) { animation-delay: .045s; }
  .board.enter .gp:nth-child(3) { animation-delay: .09s; }
  .board.enter .gp:nth-child(4) { animation-delay: .135s; }
  .board.enter .gp:nth-child(5) { animation-delay: .18s; }
  .board.enter .gp:nth-child(n+6) { animation-delay: .22s; }

  /* A tag that appears pops rather than blinks into place. */
  @keyframes pop-in { from { opacity: 0; transform: scale(.88); } }
  .tag.exit:not([hidden]) { animation: pop-in var(--fast) var(--ease); }

  /* Toasts leave the way they arrived. */
  @keyframes toast-out { to { opacity: 0; transform: translateY(6px) scale(.98); } }
  .toast.out { animation: toast-out .19s var(--ease) forwards; }

  /* One switch for all of it. Asked for less motion, the page still changes —
     it just stops taking time over it. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important; animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }

  /* ------------------------------------------------------------ responsive */
  /* ------------------------------------------------------------- m-ports */
  .m-ports { padding: 22px 28px 28px; gap: 16px; overflow: auto; }
  .m-ports .head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .m-ports h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.015em; }
  .m-ports .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12.5px; background: var(--sunken); border: 1px solid var(--line); color: var(--muted); }
  .chip b { color: var(--fg); font-weight: 500; }
  .chip.warn { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
  .chip.warn b { color: inherit; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .tbl th { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--raised); }
  .tbl td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .tbl tr:last-child td { border-bottom: 0; }
  .tbl td.port { font-family: var(--mono); font-weight: 500; width: 90px; }
  .tbl td.holder { font-family: var(--mono); font-size: 12.5px; color: var(--fg-2); }
  .tbl a.st { color: var(--fg); text-decoration: none; font-weight: 500; }
  .tbl a.st:hover { color: var(--accent); }
  .tbl .empty { color: var(--faint); padding: 26px 14px; text-align: center; }
  .st-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; }
  .st-pill .dot { width: 7px; height: 7px; }
  .st-pill.good { color: var(--good); } .st-pill.good .dot { background: var(--good); }
  .st-pill.warn { color: var(--warn); } .st-pill.warn .dot { background: var(--warn); }
  .st-pill.muted { color: var(--faint); }
  .tbl .wrap-x { overflow-x: auto; }

  /* -------------------------------------------------------------- m-perf */
  /* The series slots, in the order that clears every colour-blindness gate on
     this page's own surfaces for adjacent marks — which is what the bands of a
     stack are. Dark is the same hues stepped for the dark surface, declared
     under both the OS media query and the theme toggle so the toggle wins
     either way. Slot 0 is the grey for "everything else": that band is
     context, not an identity, so it never takes a hue. */
  .m-perf {
    --s0: #A8B0BA; --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
    padding: 22px 28px 28px; gap: 16px; overflow: auto;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .m-perf {

    }
  }
  :root[data-theme="dark"] .m-perf {
    --s0: #5E6875; --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  }
  .m-perf .head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .m-perf h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.015em; }
  .m-perf .p-head { display: block; }
  .p-note { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--faint); margin-left: 10px; }

  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 14px; }
  .chart { display: flex; flex-direction: column; padding-bottom: 8px; }
  .c-head { display: flex; align-items: baseline; gap: 10px; padding: 12px 16px 0; }
  .c-title { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  /* Proportional figures on purpose: tabular-nums gives every digit the width
     of a zero, which reads loose at this size. Tabular belongs in the table
     below, where the columns have to line up. */
  .c-value { margin-left: auto; font-size: 21px; font-weight: 600; letter-spacing: -.02em; }
  .c-legend { display: flex; flex-wrap: wrap; gap: 5px 14px; padding: 9px 16px 3px; }
  .lg { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .lg b { color: var(--fg-2); font-weight: 500; }
  .lg i, .ct-r i, i.lgd { width: 9px; height: 9px; border-radius: 2px; flex: none; display: inline-block; }
  i.lgd { margin-right: 7px; vertical-align: -1px; }

  /* The plot box includes the tick band, so the axis is never the thing that
     gets a nested scrollbar. */
  .c-plot { position: relative; height: 170px; }
  .c-plot svg { display: block; width: 100%; height: 100%; }
  .c-plot .grid { stroke: var(--line); stroke-width: 1; }
  .c-plot .tick { fill: var(--faint); font: 10.5px var(--mono); font-variant-numeric: tabular-nums; }
  .c-plot .band { fill-opacity: .8; }
  /* A 2px gap in the surface colour is what separates two fills — never a
     border drawn around one. */
  .c-plot .seam { fill: none; stroke: var(--surface); stroke-width: 2; stroke-linejoin: round; }
  .c-empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--faint); font-size: 12.5px; }
  .c-plot .crosshair { position: absolute; top: 10px; bottom: 20px; width: 1px; background: var(--line-strong); pointer-events: none; }
  .ct {
    position: absolute; top: 12px; z-index: 2; pointer-events: none;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
    box-shadow: var(--shadow); padding: 7px 9px; font-size: 12px; min-width: 130px;
  }
  .ct-t { color: var(--muted); font-size: 11px; margin-bottom: 3px; }
  .ct-t b { color: var(--fg); }
  .ct-r { display: flex; align-items: center; gap: 6px; color: var(--fg-2); line-height: 1.7; }
  .ct-r b { margin-left: auto; padding-left: 12px; color: var(--fg); font-weight: 500; }

  /* Square where it starts, 4px rounded where the data ends. */
  .meter { --m: var(--accent); height: 6px; border-radius: 4px;
           background: color-mix(in srgb, var(--m) 16%, transparent); }
  .meter > i { display: block; height: 100%; background: var(--m); border-radius: 0 4px 4px 0;
               transition: width .4s var(--ease); }

  tr.pf-stack td { font-weight: 500; }
  tr.pf-stack td:first-child { padding-top: 13px; }
  tr.pf-pane td { color: var(--muted); border-bottom-color: transparent; }
  tr.pf-pane td:first-child { padding-left: 26px; }

  /* --------------------------------------------------------------- m-chat */
  .m-chat .shell { flex: 1; min-height: 0; display: grid; grid-template-columns: var(--side-w, 264px) 6px 1fr; }
  .m-chat .main { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .ch-head { display: flex; align-items: flex-start; gap: 16px; padding: 14px 24px 12px; border-bottom: 1px solid var(--line); flex: none; }
  .ch-head h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
  .ch-tools { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
  .ch-sel { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .ch-sel .in { width: auto; height: 30px; padding: 0 8px; font-size: 12.5px; }
  /* What the session actually resolved to, which an alias does not tell you. */
  .ch-live { color: var(--faint); }
  .ch-cost { font-size: 12.5px; color: var(--muted); font-family: var(--mono); }

  .ch-log { flex: 1; min-height: 0; overflow: auto; padding: 18px 24px 10px; display: flex; flex-direction: column; gap: 10px; }
  .ch-log > * { max-width: 800px; }

  .msg { border-radius: 10px; padding: 10px 14px; line-height: 1.6; overflow-wrap: anywhere; white-space: pre-wrap; }
  .msg.me { background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 22%, transparent); align-self: flex-end; }
  .msg.claude { background: var(--surface); border: 1px solid var(--line); }
  .msg b { font-weight: 600; }
  .msg a { color: var(--accent); }
  .msg code, .fold code { font-family: var(--mono); font-size: .9em; background: var(--sunken); padding: 1px 4px; border-radius: 4px; }
  pre.code {
    margin: 8px 0 0; padding: 10px 12px; background: var(--term-bg); color: var(--term-fg);
    border-radius: 8px; font: 12px/1.55 var(--mono); white-space: pre-wrap;
    overflow-wrap: anywhere; max-height: 320px; overflow: auto;
  }
  .msg pre.code { margin: 8px 0; }

  /* Tool calls and thinking are folded by default: they are how the answer was
     reached, and they are there when that is the question. */
  .fold { font-size: 12.5px; }
  .fold summary { cursor: pointer; color: var(--muted); display: flex; gap: 8px; align-items: baseline; padding: 4px 2px; border-radius: 6px; list-style: none; }
  .fold summary::-webkit-details-marker { display: none; }
  .fold summary::before { content: '›'; color: var(--faint); transition: transform var(--fast) var(--ease); display: inline-block; }
  .fold details[open] summary::before { transform: rotate(90deg); }
  .fold summary:hover { color: var(--fg); }
  .fold .tname { font-family: var(--mono); font-weight: 500; color: var(--fg-2); flex: none; }
  .fold .tsum { font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fold.failed .tname { color: var(--bad); }
  .fold.think summary { font-style: italic; }
  .fold.think div { color: var(--muted); white-space: pre-wrap; padding: 6px 2px; line-height: 1.6; }
  .tres-h { margin-top: 10px; color: var(--faint); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }

  .ch-log .note { color: var(--faint); font-size: 12px; font-family: var(--mono); }
  .ch-log .note.bad { color: var(--bad); }

  /* The one thing on the page that waits for a person. */
  .perm { border: 1px solid var(--warn); background: var(--warn-soft); border-radius: 10px; padding: 12px 14px; }
  .perm-h { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13.5px; color: var(--warn); }
  .perm-h svg { width: 15px; height: 15px; flex: none; }
  .perm-sum { font-family: var(--mono); font-size: 12.5px; margin: 7px 0 4px; overflow-wrap: anywhere; }
  .perm details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  .perm-act { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 10px; }
  .perm.done { border-color: var(--line); background: var(--raised); }
  .perm.done .perm-h { color: var(--muted); }
  .perm-said { font-size: 12.5px; color: var(--muted); }
  .perm.done.ok .perm-said { color: var(--good); }
  .perm.done.no .perm-said { color: var(--bad); }

  .ch-compose { flex: none; display: flex; flex-direction: column; gap: 8px; padding: 12px 24px 16px; border-top: 1px solid var(--line); background: var(--surface); }
  .ch-row { display: flex; gap: 8px; align-items: flex-end; }
  .ch-row .icon-btn { height: 38px; width: 38px; flex: none; }

  /* What is queued to go with the next message, and what went with an old one. */
  .ch-shots { display: flex; gap: 8px; flex-wrap: wrap; }
  .shot { position: relative; display: inline-flex; }
  .shot img { height: 56px; width: auto; max-width: 120px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); display: block; }
  .shot-x {
    position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--surface); color: var(--muted);
    font-size: 10px; line-height: 1; display: grid; place-items: center; padding: 0;
  }
  .shot-x:hover { color: var(--bad); border-color: var(--bad); }
  .shots { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .shots .shot-img { max-height: 220px; max-width: 100%; border-radius: 8px; border: 1px solid var(--line); display: block; }
  .m-chat.dropping { outline: 2px dashed var(--accent); outline-offset: -8px; }
  .ch-compose textarea {
    flex: 1; resize: none; min-height: 38px; max-height: 220px; padding: 9px 12px;
    border-radius: var(--r); border: 1px solid var(--line); background: var(--bg); color: var(--fg);
    font: 14px/1.5 var(--sans);
  }
  .ch-compose textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  .ch-compose .btn { height: 38px; }
  .ch-compose .btn svg { width: 15px; height: 15px; }

  @media (max-width: 760px) {
    .menu a span:not(.k) { display: none; }

    .usage .u-w b, .usage .u-w .meter { display: none; }

    .m-stacks .shell, .m-chat .shell { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }

    .drawer { width: 100%; }
    .main { overflow: auto; }

    .gp { position: static !important; width: auto !important; height: 260px !important; }
    .gp.term { height: 320px !important; }
    .gp-resize, .gp-ph { display: none; }
    .m-ports, .m-perf { padding: 16px; }
    .side { border-right: 0; border-bottom: 1px solid var(--line); max-height: 40vh; }
    .side-foot { display: none; }
    .detail { padding: 16px 16px 0; }
    .summary { display: none; }
  }
</style>

    'ch.model.fail': ['เปลี่ยนรุ่นไม่สำเร็จ', 'Could not change the model'],
    'ch.mode': ['สิทธิ์', 'Permissions'],
    'ch.mode.manual': ['ถามทุกครั้ง', 'Ask every time'],
    'ch.mode.acceptEdits': ['แก้ไฟล์ได้เลย', 'Edits without asking'],
    'ch.mode.auto': ['ให้ตัดสินเอง', 'Decide automatically'],
    'ch.mode.plan': ['วางแผนอย่างเดียว', 'Plan only'],
    'ch.mode.set': ['เปลี่ยนเป็น "{mode}" แล้ว — เริ่ม session ใหม่ บทสนทนาเดิมยังอยู่',
                    'Now "{mode}" — the session restarted, the conversation is kept'],
    'ch.mode.fail': ['เปลี่ยนสิทธิ์ไม่สำเร็จ', 'Could not change permissions'],
    'ch.thinking': ['กำลังคิด', 'Thinking'],
    'ch.tool.out': ['ผลลัพธ์', 'Result'], 'ch.tool.err': ['ผิดพลาด', 'Error'],
    'ch.perm': ['ขออนุญาตใช้ {tool}', 'Permission to use {tool}'],
    'ch.perm.detail': ['ดูรายละเอียดที่จะทำ', 'See exactly what it would do'],
    'ch.allow': ['อนุญาต', 'Allow'], 'ch.deny': ['ไม่อนุญาต', 'Deny'],
    'ch.allowed': ['อนุญาตแล้ว', 'Allowed'], 'ch.denied': ['ไม่อนุญาต', 'Denied'],
    'ch.perm.fail': ['ตอบคำขอไม่สำเร็จ', 'Could not answer the request'],
    'ch.started': ['เริ่มคุยที่ {dir} · สิทธิ์: {mode}', 'Talking in {dir} · permissions: {mode}'],
    'ch.exited': ['session ปิดแล้ว — พิมพ์ต่อได้เลย เดี๋ยวเปิดใหม่ให้',
                  'The session ended — type again and it starts back up'],
    'ch.failed': ['จบไม่สำเร็จ ({why})', 'Ended with {why}'],
    'ch.tokens': ['{n} token', '{n} tokens'],
    'ch.noclaude': ['ไม่พบคำสั่ง claude บนเครื่อง — ตั้ง NK_CLAUDE_BIN ให้ชี้ไปที่ไฟล์',
                    'No claude binary found — point NK_CLAUDE_BIN at one'],
    'ch.state.fail': ['อ่านสถานะห้องคุยไม่ได้', 'Could not read the conversation'],
    'ch.send.fail': ['ส่งข้อความไม่สำเร็จ', 'Could not send that'],
    'ch.stop.fail': ['หยุดไม่สำเร็จ', 'Could not stop it'],
  };
  let lang = 'th';
  try { lang = localStorage.getItem('d3v-lang') || ((navigator.language || '').toLowerCase().startsWith('th') ? 'th' : 'en'); } catch {}
  const t = (key, vars = {}) => {
    const row = STR[key]; if (!row) return key;
    return row[lang === 'th' ? 0 : 1].replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? '');
  };

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const home = (p) => (HOME && p && p.startsWith(HOME)) ? '~' + p.slice(HOME.length) : p;

  async function api(path, method = 'GET', body) {
    const r = await fetch(path, {
      method,
      headers: body ? { 'Content-Type': 'application/json' } : undefined,
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await r.json().catch(() => ({ error: 'ตอบกลับไม่ใช่ JSON' }));
    if (!r.ok) throw new Error(data.error || r.statusText);
    return data;
  }

  function toast(title, { cli, detail, kind = 'info', ttl = 5000 } = {}) {
    const el = document.createElement('div');
    el.className = `toast ${kind}`;
    el.innerHTML = `<div>${esc(title)}</div>` +
      (cli ? `<code>$ ${esc(cli)}</code>` : '') +
      (detail ? `<pre>${esc(detail)}</pre>` : '');
    document.getElementById('toasts').append(el);
    setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 200); }, ttl);
  }

  const icons = {
    play: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M4.5 3.2v9.6l8-4.8z"/></svg>',
    stop: '<svg viewBox="0 0 16 16" fill="currentColor"><rect x="3.5" y="3.5" width="9" height="9" rx="1.5"/></svg>',
    cycle: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2.5v3h-3"/></svg>',
    edit: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11.3 2.7l2 2L5.5 12.5H3.5v-2z"/></svg>',
    ext: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6.5 3.5h-3v9h9v-3M9.5 2.5h4v4M13.5 2.5L7.5 8.5"/></svg>',
    plus: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3v10M3 8h10"/></svg>',
    spin: '<svg class="spin" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 2.5a5.5 5.5 0 1 1-5.5 5.5"/></svg>',
    tabs: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="3.5" width="12" height="10" rx="1.5"/><path d="M2 6.5h12M6 3.5v3"/></svg>',
    cols: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M8 3v10"/></svg>',
    rows: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M2 8h12"/></svg>',
    list: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5.5 4h8M5.5 8h8M5.5 12h8M2.5 4h.01M2.5 8h.01M2.5 12h.01"/></svg>',
    term: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M4.8 6.5L6.8 8l-2 1.5M8.5 10h3"/></svg>',
    grid: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.5" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="9" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="2.5" y="9" width="4.5" height="4.5" rx="1"/><rect x="9" y="9" width="4.5" height="4.5" rx="1"/></svg>',
    stack: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.5 5.5L8 2.5l5.5 3L8 8.5z"/><path d="M2.5 8.5L8 11.5l5.5-3M2.5 11.5L8 14.5l5.5-3"/></svg>',
    port: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.5" y="4.5" width="11" height="7" rx="1.5"/><path d="M5.5 7.5v1M8 7.5v1M10.5 7.5v1"/></svg>',
    chat: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M13.5 9.5a2 2 0 0 1-2 2H6l-3.5 2.5v-2.5a2 2 0 0 1-.5-1.3V4.5a2 2 0 0 1 2-2h7.5a2 2 0 0 1 2 2z"/></svg>',
    clip: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 5.2L5.6 10a1.7 1.7 0 0 0 2.4 2.4l5.2-5.2a3 3 0 0 0-4.2-4.2L3.5 8.4a4.3 4.3 0 0 0 6 6L14 10"/></svg>',
    shield: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M8 1.8l5 1.8v4.1c0 3-2.1 5.2-5 6.5-2.9-1.3-5-3.5-5-6.5V3.6z"/></svg>',
    gauge: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.2 11.8a6.2 6.2 0 1 1 11.6 0"/><path d="M8 11.3L10.9 6.9"/></svg>',
  };

  const parse = () => {
    const [id, ...rest] = location.hash.replace(/^#\/?/, '').split('/');
    return { id, param: decodeURIComponent(rest.join('/')) };
  };

  const label = (m) => m.labelKey ? t(m.labelKey) : m.label;

  function applyChrome() {
    document.documentElement.lang = lang;
    document.getElementById('pal-btn-text').textContent = t('pal.btn');
    document.getElementById('pal-in').placeholder = t('pal.ph');
    document.getElementById('pal-foot').textContent = t('pal.hint');
    document.getElementById('notify').title = t('chrome.notify');
    document.getElementById('theme').title = t('chrome.theme');
    document.getElementById('refresh').title = t('chrome.refresh');
    const lb = document.getElementById('lang');
    lb.title = t('chrome.lang');
    for (const b of lb.querySelectorAll('[data-lang]')) b.classList.toggle('on', b.dataset.lang === lang);
  }

  function setLang(l) {
    if (l === lang) return;
    lang = l;
    try { localStorage.setItem('d3v-lang', l); } catch {}
    applyChrome();
    if (lastUsage) setUsage(lastUsage);   // the window labels are translated too
    // Remount the current menu so every string re-renders in the new language.
    const m = mounted; const { param } = parse();
    if (m) { m.unmount?.(); mounted = null; const v = document.getElementById('view'); v.innerHTML = ''; }
    route(); void param;
  }

  function renderNav() {
    document.getElementById('menu').innerHTML = mods.map((m, i) =>
      `<a href="#/${m.id}" data-route="${m.id}" class="${mounted?.id === m.id ? 'on' : ''}">${m.icon || ''}<span>${esc(label(m))}</span><span class="k">${i + 1}</span></a>`
    ).join('');
  }

  function route() {
    if (!mods.length) return;
    const { id, param } = parse();
    const m = mods.find((x) => x.id === id) || mods[0];
    const view = document.getElementById('view');
    if (mounted?.id !== m.id) {
      mounted?.unmount?.();
      view.innerHTML = '';
      view.className = `view m-${m.id}`;
      document.getElementById('actions').innerHTML = '';
      mounted = m;
      m.mount(view, param);
      baseTitle = `${label(m)} · D3v`;
      setBadge(lastBadge);
    } else {
      m.navigate?.(param);
    }
    renderNav();
  }

  function register(m) { mods.push(m); route(); }

  addEventListener('hashchange', route);
  document.getElementById('refresh').onclick = () => mounted?.refresh?.();
  document.getElementById('lang').onclick = (ev) => { const b = ev.target.closest('[data-lang]'); if (b) setLang(b.dataset.lang); };
  applyChrome();
  document.addEventListener('keydown', (ev) => {
    // 1..9 switch menus, unless typing — into a field, or into a terminal
    // panel, which is a textbox in its own right and claims its keys first.
    if (ev.defaultPrevented || ev.target.closest('input, textarea, [role="textbox"], [contenteditable]') ||
        document.querySelector('dialog[open]')) return;
    const n = parseInt(ev.key, 10);
    if (n >= 1 && n <= mods.length && !ev.metaKey && !ev.ctrlKey) location.hash = `#/${mods[n - 1].id}`;
  });

  (function theme() {
    const root = document.documentElement;
    try { const t = localStorage.getItem('d3v-theme'); if (t) root.dataset.theme = t; } catch {}
    document.getElementById('theme').onclick = () => {
      const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      root.dataset.theme = dark ? 'light' : 'dark';
      try { localStorage.setItem('d3v-theme', root.dataset.theme); } catch {}
    };
  })();

  (async () => {
    try { HOME = (await api('/api/browse?path=~')).path; } catch {}
    mounted?.refresh?.();
    pollUsage();
    // Reading a stored value, not asking Claude: the cost of this is a dict
    // lookup, and it only changes when a conversation has a turn.
    setInterval(() => { if (!document.hidden) pollUsage(); }, 30000);
  })();

  // setActions(html) — a module puts its header-level buttons here.
  const setActions = (html) => { document.getElementById('actions').innerHTML = html; };

  // -------------------------------------------------------------- state --
  // stateOf — what a stack is doing, from what nk reports: the tmux session,
  // who holds its ports, and the exit code of any pane whose command ended.
  // "running" alone would call a crashed pane running: its shell stays open.
  function stateOf(s) {
    if (!s.running) return 'stopped';
    if (Object.values(s.exits || {}).some((c) => c !== 0)) return 'crashed';
    if (s.ports.some((p) => p.pid != null) || (s.detected || []).length) return 'ready';
    return s.ports.length ? 'starting' : 'running';
  }
  const STATE = {   // state -> [label key, css class]
    stopped: ['st.stopped', ''], running: ['st.running', 'on'], ready: ['st.ready', 'on'],
    starting: ['st.starting', 'starting'], crashed: ['st.crashed', 'bad'],
  };

  // -------------------------------------------------------------- badge --
  // The tab tells the state while another window has the attention: a
  // favicon dot and a "2/4 up" title prefix.
  let baseTitle = 'D3v', lastBadge = {};
  const favicon = document.createElement('link'); favicon.rel = 'icon'; document.head.append(favicon);
  function setBadge({ text = '', kind = 'idle' } = {}) {
    lastBadge = { text, kind };
    document.title = (text ? `${text} · ` : '') + baseTitle;
    const c = { good: '#1F9D62', warn: '#E0A030', bad: '#D64545', idle: '#97A1AE' }[kind] || '#97A1AE';
    favicon.href = 'data:image/svg+xml,' + encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#141922"/><circle cx="16" cy="16" r="8" fill="${c}"/></svg>`);
  }

  // -------------------------------------------------------------- usage --
  // The allowance arrives with every chat turn and nowhere else — there is no
  // command that reports it, and asking for one would mean spending a turn to
  // find out what a turn costs. So this shows the last reading and says how old
  // it is rather than pretending to be live.
  const WINDOWS = [['five_hour', 'use.5h', 'use.win.5h'], ['seven_day', 'use.7d', 'use.win.7d']];
  let usageAt = 0, lastUsage = null;

  function ago(seconds) {
    if (seconds < 90) return t('use.ago.now');
    if (seconds < 5400) return t('use.ago.m', { n: Math.round(seconds / 60) });
    return t('use.ago.h', { n: Math.round(seconds / 3600) });
  }

  function setUsage({ at, info } = {}) {
    const box = document.getElementById('usage');
    const windows = info && info.unifiedWindows;
    if (!windows) { box.hidden = true; return; }
    lastUsage = { at: at || usageAt, info };
    usageAt = at || usageAt;
    box.hidden = false;
    const capped = info.status && info.status !== 'allowed';
    for (const [key, shortKey, longKey] of WINDOWS) {
      const el = box.querySelector(`[data-w="${key}"]`);
      const w = windows[key];
      el.hidden = !w;
      if (!w) continue;
      const pct = Math.round(Math.min(1, Math.max(0, w.utilization || 0)) * 100);
      el.querySelector('b').textContent = t(shortKey);
      el.querySelector('.u-n').textContent = `${pct}%`;
      const meter = el.querySelector('.meter');
      const sev = capped || pct >= 100 ? 'bad' : pct >= 75 ? 'warn' : '';
      meter.className = sev ? `meter ${sev}` : 'meter';
      meter.querySelector('i').style.width = `${pct}%`;
      const resets = w.resetsAt ? new Date(w.resetsAt * 1000)
        .toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
      el.title = t('use.title', { pct, win: t(longKey), at: resets }) +
        (capped ? ` · ${t('use.capped')}` : '') +
        (usageAt ? ` · ${t('use.as', { ago: ago(Date.now() / 1000 - usageAt) })}` : '');
    }
  }

  async function pollUsage() {
    try { setUsage(await api('/api/usage')); } catch {}
  }

  // ------------------------------------------------------------- notify --
  // Desktop notifications, opt-in via the bell, and only while the tab is
  // hidden — on screen the page itself is the notification.
  let notifyOn = false;
  try { notifyOn = localStorage.getItem('d3v-notify') === '1'; } catch {}
  const bell = document.getElementById('notify');
  const paintBell = () => bell.classList.toggle('on', notifyOn);
  bell.onclick = async () => {
    if (!notifyOn) {
      if (!('Notification' in window)) return toast(t('chrome.notify.denied'), { kind: 'bad' });
      let perm = Notification.permission;
      if (perm === 'default') perm = await Notification.requestPermission();
      if (perm !== 'granted') return toast(t('chrome.notify.denied'), { kind: 'bad' });
    }
    notifyOn = !notifyOn;
    try { localStorage.setItem('d3v-notify', notifyOn ? '1' : '0'); } catch {}
    paintBell();
    toast(t(notifyOn ? 'chrome.notify.on' : 'chrome.notify.off'));
  };
  paintBell();
  function notify(title, body = '') {
    if (!notifyOn || !document.hidden || !('Notification' in window) || Notification.permission !== 'granted') return;
    try { new Notification(title, { body, silent: true }); } catch {}
  }

  // announce(stacks) — badge + notifications from a fresh stack list. Every
  // module that polls /api/stacks hands its result here, so the badge is
  // current whichever menu is open. Transitions are detected against the
  // previous list: a pane that just died, a stack that just became ready.
  let seen = null;   // name -> { state, exits }
  function announce(list) {
    const states = list.map((s) => stateOf(s));
    const up = list.filter((s) => s.running).length, crashed = states.filter((x) => x === 'crashed').length;
    setBadge({
      text: list.length ? (crashed ? '✕ ' : '') + t('badge.up', { up, total: list.length }) : '',
      kind: crashed ? 'bad' : states.includes('starting') ? 'warn' : up ? 'good' : 'idle',
    });
    if (seen) for (const s of list) {
      const p = seen.get(s.name); if (!p) continue;
      for (const [pane, code] of Object.entries(s.exits || {}))
        if (code !== 0 && p.exits[pane] !== code) notify(t('st.notify.crash', { name: s.name, pane, code }));
      if (p.state === 'starting' && stateOf(s) === 'ready') notify(t('st.notify.ready', { name: s.name }), s.url || '');
    }
    seen = new Map(list.map((s) => [s.name, { state: stateOf(s), exits: { ...(s.exits || {}) } }]));
  }

  // ------------------------------------------------------------ palette --
  // Ctrl-K: type what to do. Modules register providers that return
  // { label, cli?, icon?, keys?, run }; every item shows its nk command, so
  // the palette doubles as the CLI's cheat sheet.
  const providers = [];
  const commands = (fn) => providers.push(fn);
  const pal = document.getElementById('palette'), palIn = document.getElementById('pal-in'), palList = document.getElementById('pal-list');
  let palItems = [], palSel = 0;
  function palRender() {
    const q = palIn.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const all = providers.flatMap((f) => { try { return f() || []; } catch { return []; } });
    palItems = all.filter((c) => { const hay = `${c.label} ${c.cli || ''} ${c.keys || ''}`.toLowerCase(); return q.every((w) => hay.includes(w)); }).slice(0, 14);
    palSel = Math.min(palSel, Math.max(0, palItems.length - 1));
    palList.innerHTML = palItems.length ? palItems.map((c, i) =>
      `<div class="pal-item ${i === palSel ? 'on' : ''}" data-i="${i}"><span class="pal-ico">${c.icon || ''}</span><span class="pal-label">${esc(c.label)}</span>${c.cli ? `<code>$ ${esc(c.cli)}</code>` : ''}</div>`).join('')
      : `<div class="pal-empty">${t('pal.empty')}</div>`;
  }
  function palOpen() { palIn.value = ''; palSel = 0; palRender(); pal.showModal(); palIn.focus(); }
  function palRun(i) { const c = palItems[i]; if (!c) return; pal.close(); c.run(); }
  palIn.oninput = () => { palSel = 0; palRender(); };
  palIn.onkeydown = (ev) => {
    if (ev.key === 'ArrowDown') { ev.preventDefault(); palSel = Math.min(palItems.length - 1, palSel + 1); palRender(); }
    else if (ev.key === 'ArrowUp') { ev.preventDefault(); palSel = Math.max(0, palSel - 1); palRender(); }
    else if (ev.key === 'Enter') { ev.preventDefault(); palRun(palSel); }
  };
  palList.onclick = (ev) => { const it = ev.target.closest('[data-i]'); if (it) palRun(+it.dataset.i); };
  pal.addEventListener('click', (ev) => { if (ev.target === pal) pal.close(); });
  document.getElementById('pal-btn').onclick = palOpen;
  document.addEventListener('keydown', (ev) => {
    if ((ev.ctrlKey || ev.metaKey) && !ev.altKey && ev.key.toLowerCase() === 'k') { ev.preventDefault(); pal.open ? pal.close() : palOpen(); }
  });
  commands(() => mods.filter((m) => m.id !== mounted?.id).map((m) => ({
    label: t('pal.go', { menu: label(m) }), icon: m.icon, keys: m.id, run: () => { location.hash = `#/${m.id}`; },
  })));

  return { register, api, toast, esc, home, icons, setActions, t, stateOf, STATE, setBadge, notify, announce, commands, setUsage,
           get lang() { return lang; }, get HOME() { return HOME; } };
})();
</script>
<script src="modules/stacks.js"></script>
<script src="modules/ports.js"></script>
<script src="modules/perf.js"></script>
<script src="modules/chat.js"></script>
</html>
